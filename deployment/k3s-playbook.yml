---
- name: Configure K3s Orchestrator
  hosts: k3s_orchestrator
  become: true

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Add SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Set proper hostname
      ansible.builtin.hostname:
        name: home-server
    
    - name: install deps via apt
      apt:
        name:
          - python3-yaml
          - python3-kubernetes
          - iptables
          - curl

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="--flannel-backend=none --disable-network-policy" sh -
      args:
        creates: /etc/systemd/system/k3s.service
    
    - name: Ensure K3s service is started and enabled
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API to be stable
      ansible.builtin.shell: |
        kubectl get --raw /readyz
      register: result
      until: result.rc == 0 and result.stdout == "ok"
      retries: 30
      delay: 5
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml                 

    - name: Install Helm
      ansible.builtin.shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Wait for K3s API to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Add Calico operator
      ansible.builtin.shell: |
        kubectl apply --server-side --force-conflicts --validate=false -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/tigera-operator.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Calico
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: operator.tigera.io/v1
        kind: Installation
        metadata:
          name: default
        spec:
          calicoNetwork:
            ipPools:
            - cidr: 10.42.0.0/16
              encapsulation: VXLAN
        EOF
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Add KEDA Helm repository
      kubernetes.core.helm_repository:
        name: kedacore
        repo_url: https://kedacore.github.io/charts
        state: present
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Add Kyverno Helm repository
      kubernetes.core.helm_repository:
        name: kyverno
        repo_url: https://kyverno.github.io/kyverno/
        state: present
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Create keda namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: keda
        state: present
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Create KEDA CA configmap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: custom-ca
            namespace: keda
          data:
            ca.crt: "{{ lookup('file', '../docker/certs/rootCA.pem') }}"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Keda via Helm
      kubernetes.core.helm:
        name: keda
        chart_ref: kedacore/keda
        release_namespace: keda
        create_namespace: true
        update_repo_cache: true
        values:
          extraVolumes:
            - name: custom-ca
              configMap:
                name: custom-ca
          extraVolumeMounts:
            - name: custom-ca
              mountPath: /etc/keda/tls/ca.crt
              subPath: ca.crt
          env:
            - name: SSL_CERT_FILE
              value: /etc/keda/tls/ca.crt
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Kyverno via Helm
      kubernetes.core.helm:
        name: kyverno
        chart_ref: kyverno/kyverno
        release_namespace: kyverno
        create_namespace: true
        update_repo_cache: true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for node token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: raw_token

    - name: Store cluster connection facts
      ansible.builtin.set_fact:
        k3s_token: "{{ raw_token.content | b64decode | trim }}"
        orchestrator_ip: >-
          {{
            ansible_host
            | default(ansible_default_ipv4.address)
          }}

    - name: Verify K3s server install
      ansible.builtin.command: k3s --version
      register: k3s_version
      changed_when: false

    - name: Fetch kubeconfig from orchestrator
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig
        flat: true
    - name: Replace localhost in kubeconfig
      ansible.builtin.replace:
        path: /etc/rancher/k3s/k3s.yaml
        regexp: "https://127.0.0.1:6443"
        replace: "https://{{ orchestrator_ip }}:6443"

    - name: Show K3s server version
      ansible.builtin.debug:
        var: k3s_version.stdout

- name: Configure K3s Workers
  hosts: k3s_workers
  become: true

  vars:
    ansible_python_interpreter: auto_silent
    master_host: "{{ groups['k3s_orchestrator'][0] }}"

  tasks:
    - name: Add SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    #################################################################
    # Raspberry Pi prerequisite handling
    #################################################################

    - name: Detect Raspberry Pi systems
      ansible.builtin.set_fact:
        is_rpi: "{{ inventory_hostname.startswith('rpi') or 'rpi' in inventory_hostname }}"

    - name: Detect cmdline path on Raspberry Pi
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: cmdline_fw
      when: is_rpi

    - name: Set cmdline path
      ansible.builtin.set_fact:
        cmdline_path: >-
          {{
            '/boot/firmware/cmdline.txt'
            if cmdline_fw.stat.exists
            else '/boot/cmdline.txt'
          }}
      when: is_rpi

    - name: Read current cmdline
      ansible.builtin.slurp:
        src: "{{ cmdline_path }}"
      register: cmdline_content
      when: is_rpi

    - name: Ensure cgroup memory args exist
      ansible.builtin.lineinfile:
        path: "{{ cmdline_path }}"
        regexp: "^(.*)$"
        line: >-
          {{
            (
              cmdline_content.content
              | b64decode
              | trim
            )
            + ' cgroup_enable=memory cgroup_memory=1'
          }}
        state: present
      register: cgroup_update
      when:
        - is_rpi
        - "'cgroup_enable=memory' not in (cmdline_content.content | b64decode)"

    - name: Reboot Raspberry Pi workers if required
      ansible.builtin.reboot:
        msg: "Rebooting to apply Raspberry Pi cgroup changes"
        reboot_timeout: 300
      when:
        - is_rpi
        - cgroup_update is changed

    #################################################################
    # install
    #################################################################

    - name: Install curl
      ansible.builtin.apt:
    - name: Wait for orchestrator API to become reachable
      ansible.builtin.wait_for:
        host: "{{ hostvars[master_host].orchestrator_ip }}"
        port: 6443
        timeout: 120

    - name: Install K3s worker
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[master_host].orchestrator_ip }}:6443 \
        K3S_TOKEN={{ hostvars[master_host].k3s_token }} \
        INSTALL_K3S_EXEC="agent --node-name {{ inventory_hostname }}" sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service

    - name: Ensure K3s agent is running
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

    - name: Wait for K3s agent socket
      ansible.builtin.wait_for:
        path: /run/k3s/containerd/containerd.sock
        timeout: 120

    - name: Verify K3s worker install
      ansible.builtin.command: k3s --version
      register: k3s_version
      changed_when: false

    - name: Show K3s worker version
      ansible.builtin.debug:
        var: k3s_version.stdout
