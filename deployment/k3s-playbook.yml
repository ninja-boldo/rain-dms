---
- name: Configure K3s Orchestrator
  hosts: k3s_orchestrator
  become: true

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Add SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Set proper hostname
      ansible.builtin.hostname:
        name: home-server

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="server --node-name home-server" sh -
      args:
        creates: /etc/systemd/system/k3s.service

    - name: Ensure K3s service is running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for node token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: raw_token

    - name: Store cluster connection facts
      ansible.builtin.set_fact:
        k3s_token: "{{ raw_token.content | b64decode | trim }}"
        orchestrator_ip: >-
          {{
            ansible_host
            | default(ansible_default_ipv4.address)
          }}

    - name: Verify K3s server install
      ansible.builtin.command: k3s --version
      register: k3s_version
      changed_when: false

    - name: Show K3s server version
      ansible.builtin.debug:
        var: k3s_version.stdout

- name: Configure K3s Workers
  hosts: k3s_workers
  become: true

  vars:
    ansible_python_interpreter: auto_silent
    master_host: "{{ groups['k3s_orchestrator'][0] }}"

  tasks:
    - name: Add SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    #################################################################
    # Raspberry Pi prerequisite handling
    #################################################################

    - name: Detect Raspberry Pi systems
      ansible.builtin.set_fact:
        is_rpi: "{{ inventory_hostname.startswith('rpi') or 'rpi' in inventory_hostname }}"

    - name: Detect cmdline path on Raspberry Pi
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: cmdline_fw
      when: is_rpi

    - name: Set cmdline path
      ansible.builtin.set_fact:
        cmdline_path: >-
          {{
            '/boot/firmware/cmdline.txt'
            if cmdline_fw.stat.exists
            else '/boot/cmdline.txt'
          }}
      when: is_rpi

    - name: Read current cmdline
      ansible.builtin.slurp:
        src: "{{ cmdline_path }}"
      register: cmdline_content
      when: is_rpi

    - name: Ensure cgroup memory args exist
      ansible.builtin.lineinfile:
        path: "{{ cmdline_path }}"
        regexp: "^(.*)$"
        line: >-
          {{
            (
              cmdline_content.content
              | b64decode
              | trim
            )
            + ' cgroup_enable=memory cgroup_memory=1'
          }}
        state: present
      register: cgroup_update
      when:
        - is_rpi
        - "'cgroup_enable=memory' not in (cmdline_content.content | b64decode)"

    - name: Reboot Raspberry Pi workers if required
      ansible.builtin.reboot:
        msg: "Rebooting to apply Raspberry Pi cgroup changes"
        reboot_timeout: 300
      when:
        - is_rpi
        - cgroup_update is changed

    #################################################################
    # install
    #################################################################

    - name: Install curl
      ansible.builtin.apt:
    - name: Wait for orchestrator API to become reachable
      ansible.builtin.wait_for:
        host: "{{ hostvars[master_host].orchestrator_ip }}"
        port: 6443
        timeout: 120

    - name: Install K3s worker
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[master_host].orchestrator_ip }}:6443 \
        K3S_TOKEN={{ hostvars[master_host].k3s_token }} \
        INSTALL_K3S_EXEC="agent --node-name {{ inventory_hostname }}" sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service

    - name: Ensure K3s agent is running
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

    - name: Wait for K3s agent socket
      ansible.builtin.wait_for:
        path: /run/k3s/containerd/containerd.sock
        timeout: 120

    - name: Verify K3s worker install
      ansible.builtin.command: k3s --version
      register: k3s_version
      changed_when: false

    - name: Show K3s worker version
      ansible.builtin.debug:
        var: k3s_version.stdout
