apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-app-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: queue-processor   # Match the label used by the deployment
  policyTypes:
    - Egress
  egress:
    # 1. Allow DNS lookups (UDP and TCP on port 53)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow local subnet (e.g. 192.168.1.0/24)
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24