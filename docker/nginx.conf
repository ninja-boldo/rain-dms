user root;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 5000M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1000;

    server {
        listen 443 ssl;
        server_name 192.168.1.163;

        ssl_certificate     /etc/nginx/certs/rain.dms.cert.pem;
        ssl_certificate_key /etc/nginx/certs/rain.dms.cert-key.pem;

        # ─── FRONTEND ─────────────────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ─── AUTH SUBREQUEST ──────────────────────────────────────────────────
        # Simple passthrough to validate-jwt. No caching, no magic.
        location = /_auth {
            internal;

            proxy_pass https://host.docker.internal:3000/auth/validate-jwt;
            proxy_ssl_verify off;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Forward both auth mechanisms your backend accepts
            proxy_set_header Authorization  $http_authorization;
            proxy_set_header X-Auth-Token   $http_x_auth_token;
            proxy_set_header X-Username     $http_x_username;
        }

        # ─── S3 PIPELINE ──────────────────────────────────────────────────────
        location /s3/ {
            # Step 1 — JWT validation
            auth_request /_auth;

            # Capture what the auth service actually returned so we can
            # surface it in the error body below.
            auth_request_set $auth_upstream_status $upstream_status;
            auth_request_set $auth_error_reason    $upstream_http_x_auth_error;

            # Map auth failures to named error blocks
            error_page 401 = @s3_unauthorized;
            error_page 403 = @s3_forbidden;
            # Catch cases where the auth service itself is broken
            error_page 500 502 503 504 = @s3_auth_unavailable;

            # Step 2 — Proxy to SeaweedFS / S3
            rewrite ^/s3/(.*)$ /$1 break;

            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";

            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Strip any inbound Authorization so S3 doesn't get confused
            proxy_set_header Authorization      "";
            proxy_set_header Host               $http_host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            resolver 127.0.0.11 valid=10s;
            proxy_pass http://s3:8333;
        }

        # ─── BACKEND API ──────────────────────────────────────────────────────
        location ~ ^/(auth|main_page|search|pages|upload|download|delete|stats|workers|queue-peek|worker-download-stats) {
            proxy_pass          https://host.docker.internal:3000;
            proxy_ssl_verify    off;
            proxy_http_version  1.1;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $host;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
        }

        # ─── S3 ERROR HANDLERS ────────────────────────────────────────────────
        # $auth_error_reason comes from X-Auth-Error header your backend sets.
        # If your backend doesn't set that header yet, add it — it's the most
        # useful thing you can do for debugging (e.g. "token expired", "no token").

        location @s3_unauthorized {
            default_type application/json;
            return 401 '{"error":"s3_pipeline_failed","step":"jwt_validation","http_status":401,"reason":"$auth_error_reason","detail":"Auth service rejected the request. Check Authorization / X-Auth-Token header."}';
        }

        location @s3_forbidden {
            default_type application/json;
            return 403 '{"error":"s3_pipeline_failed","step":"jwt_validation","http_status":403,"reason":"$auth_error_reason","detail":"Token valid but insufficient permissions for this S3 resource."}';
        }

        location @s3_auth_unavailable {
            default_type application/json;
            return 502 '{"error":"s3_pipeline_failed","step":"auth_subrequest","http_status":$auth_upstream_status,"reason":"auth_service_unreachable","detail":"/_auth subrequest to validate-jwt returned $auth_upstream_status. Backend may be down."}';
        }
    }
}