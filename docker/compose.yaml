  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rain-dms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dms
      POSTGRES_USER:     dms_user
      POSTGRES_PASSWORD: dms_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms_user -d dms"]
      interval: 5s
      retries: 5

  # ── Meilisearch ──────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: unless-stopped
    volumes:
      - ./meili_data:/meili_data
    environment:
      MEILI_ENV:        production
      MEILI_MASTER_KEY: masterbennomasterbennomasterbennomasterbenno
      MEILI_DB_PATH:    /meili_data
    ports:
      - "7700:7700"


  # ── Nginx (static file server for banner images) ─────────────────────────────
  nginx:
    image: nginx:latest
    container_name: rain-dms-nginx
    restart: unless-stopped
    ports:
      - "7701:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

      - ../temp:/var/www/uploads


  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"  
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest  
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s


volumes:
  pgdata:

